<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Structure Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        canvas { touch-action: none; }
        .slider-thumb::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #2563eb;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="layers" class="text-blue-600"></i> Structure Lab: Ch. 9
        </h1>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-full text-sm font-medium">
                <i data-lucide="thermometer" id="temp-icon" class="text-blue-500"></i>
                <span id="temp-display">20</span>°C
            </div>
            <div id="state-badge" class="px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider bg-blue-100 text-blue-700">
                Solid
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r p-6 space-y-8 shadow-inner overflow-y-auto">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase block mb-4">Structure Type</label>
                <div class="space-y-2" id="type-controls">
                    <button onclick="setType('metallic')" id="btn-metallic" class="type-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left bg-blue-600 text-white shadow-lg">
                        <i data-lucide="zap"></i> <span class="font-semibold">Giant Metallic</span>
                    </button>
                    <button onclick="setType('ionic')" id="btn-ionic" class="type-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left bg-slate-50 text-slate-600">
                        <i data-lucide="box"></i> <span class="font-semibold">Giant Ionic</span>
                    </button>
                    <button onclick="setType('molecular')" id="btn-molecular" class="type-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left bg-slate-50 text-slate-600">
                        <i data-lucide="maximize"></i> <span class="font-semibold">Simple Molecular</span>
                    </button>
                    <button onclick="setType('covalent')" id="btn-covalent" class="type-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left bg-slate-50 text-slate-600">
                        <i data-lucide="layers"></i> <span class="font-semibold">Giant Covalent</span>
                    </button>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase block mb-4">Control Temperature</label>
                <input type="range" min="20" max="4000" value="20" id="temp-slider" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 slider-thumb">
                <div class="flex justify-between text-[10px] mt-2 text-slate-400 font-bold uppercase">
                    <span>Room Temp</span>
                    <span>Extreme Heat</span>
                </div>
            </div>

            <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                <h3 class="text-sm font-bold text-blue-800 mb-2 uppercase tracking-tight">Key Concept</h3>
                <p id="concept-text" class="text-xs text-blue-700 leading-relaxed">
                    Metallic structures consist of a lattice of cations in a 'sea' of mobile, delocalized electrons.
                </p>
            </div>
        </aside>

        <!-- Animation -->
        <main class="flex-1 p-8 relative">
            <div class="w-full h-full bg-slate-900 rounded-3xl overflow-hidden shadow-2xl relative border-8 border-slate-800">
                <canvas id="labCanvas"></canvas>
                
                <!-- Info Banner moved to right side -->
                <div class="absolute top-6 right-6 text-white bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 text-right">
                    <h2 id="title-display" class="text-lg font-bold">Giant Metallic (Copper)</h2>
                    <div id="range-display" class="text-xs text-slate-300 mt-1">
                        Melting Point: 1083°C | Boiling Point: 2562°C
                    </div>
                </div>

                <div class="absolute bottom-6 right-6 bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 space-y-2">
                    <div class="flex items-center gap-2 text-xs text-white">
                        <div id="legend-dot" class="w-3 h-3 rounded-full bg-[#b87333]"></div>
                        <span id="legend-text">Metal Ion (+)</span>
                    </div>
                    <div id="legend-extra" class="flex flex-col gap-2"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const canvas = document.getElementById('labCanvas');
        const ctx = canvas.getContext('2d');
        const tempSlider = document.getElementById('temp-slider');
        const tempDisplay = document.getElementById('temp-display');
        const tempIcon = document.getElementById('temp-icon');
        const stateBadge = document.getElementById('state-badge');
        const conceptText = document.getElementById('concept-text');
        const titleDisplay = document.getElementById('title-display');
        const rangeDisplay = document.getElementById('range-display');
        const legendDot = document.getElementById('legend-dot');
        const legendText = document.getElementById('legend-text');
        const legendExtra = document.getElementById('legend-extra');

        let structureType = 'metallic';
        let temperature = 20;
        let particles = [];

        const stats = {
            metallic: { name: 'Giant Metallic (Copper)', melt: 1083, boil: 2562, color: '#b87333', particle: 'Metal Ion (+)', concept: "Metallic structures consist of a lattice of cations in a 'sea' of mobile, delocalized electrons." },
            ionic: { name: 'Giant Ionic (NaCl)', melt: 801, boil: 1465, color: '#e0e0e0', particle: 'Ions (+/-)', concept: "Ionic bonds are electrostatic attractions between oppositely charged ions in a continuous lattice." },
            molecular: { name: 'Simple Molecular (Iodine)', melt: 114, boil: 184, color: '#a32cc4', particle: 'Molecules', concept: "During melting, only the WEAK intermolecular forces break. The internal covalent bonds stay intact!" },
            covalent: { name: 'Giant Covalent (Diamond)', melt: 3550, boil: 3900, color: '#00d4ff', particle: 'Atoms', concept: "Giant structures require breaking STRONG covalent bonds to melt, explaining high melting points." }
        };

        function initParticles() {
            particles = [];
            const rows = 5, cols = 6, spacing = 60, offsetX = 50, offsetY = 50;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    particles.push({
                        baseX: offsetX + j * spacing,
                        baseY: offsetY + i * spacing,
                        x: offsetX + j * spacing,
                        y: offsetY + i * spacing,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        type: (i + j) % 2 === 0 ? 'pos' : 'neg'
                    });
                }
            }
        }

        function setType(type) {
            structureType = type;
            const current = stats[type];
            temperature = 20;
            tempSlider.value = 20;
            
            // Update UI
            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                b.classList.add('bg-slate-50', 'text-slate-600');
            });
            const activeBtn = document.getElementById('btn-' + type);
            activeBtn.classList.remove('bg-slate-50', 'text-slate-600');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-lg');

            titleDisplay.innerText = current.name;
            rangeDisplay.innerText = `Melting Point: ${current.melt}°C | Boiling Point: ${current.boil}°C`;
            conceptText.innerText = current.concept;
            legendDot.style.backgroundColor = current.color;
            legendText.innerText = current.particle;

            // Extra legend items
            legendExtra.innerHTML = '';
            if (type === 'metallic') {
                legendExtra.innerHTML = `<div class="flex items-center gap-2 text-xs text-white"><div class="w-2 h-2 rounded-full bg-green-400"></div>Electrons</div>`;
            } else if (type === 'molecular') {
                legendExtra.innerHTML = `<div class="flex items-center gap-2 text-xs text-white"><div class="w-4 h-0.5 bg-slate-400"></div>Covalent Bond</div>`;
            }

            initParticles();
            updateStateUI();
        }

        function updateStateUI() {
            const current = stats[structureType];
            tempDisplay.innerText = temperature;
            
            if (temperature > current.boil) {
                stateBadge.innerText = 'Gas';
                stateBadge.className = 'px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider bg-red-100 text-red-700';
                tempIcon.className = 'text-red-600';
            } else if (temperature > current.melt) {
                stateBadge.innerText = 'Liquid';
                stateBadge.className = 'px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider bg-orange-100 text-orange-700';
                tempIcon.className = 'text-orange-500';
            } else {
                stateBadge.innerText = 'Solid';
                stateBadge.className = 'px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wider bg-blue-100 text-blue-700';
                tempIcon.className = 'text-blue-500';
            }
        }

        function resize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function animate() {
            const current = stats[structureType];
            const isSolid = temperature <= current.melt;
            const isLiquid = temperature > current.melt && temperature <= current.boil;
            const isGas = temperature > current.boil;
            const time = Date.now() * 0.002;
            const tempFactor = (temperature / 1000) + 0.1;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px sans-serif';

            particles.forEach((p, i) => {
                if (isSolid) {
                    const jitter = (temperature / (current.melt || 1)) * 4;
                    p.x = p.baseX + Math.sin(time + i) * jitter;
                    p.y = p.baseY + Math.cos(time + i) * jitter;
                } else if (isLiquid) {
                    p.x += p.vx * tempFactor * 2;
                    p.y += p.vy * tempFactor * 2;
                    if (p.x < 50 || p.x > canvas.width - 50) p.vx *= -1;
                    if (p.y > canvas.height - 50) p.vy *= -1;
                    if (p.y < canvas.height / 2) p.vy *= -1;
                } else {
                    p.x += p.vx * tempFactor * 6;
                    p.y += p.vy * tempFactor * 6;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                }

                if (structureType === 'molecular') {
                    const partnerX = p.x + 15;
                    const partnerY = p.y + 5;
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(partnerX, partnerY);
                    ctx.stroke();
                    
                    ctx.fillStyle = current.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(partnerX, partnerY, 10, 0, Math.PI*2); ctx.fill();

                    if (isSolid && i < particles.length - 1) {
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(particles[i+1].x, particles[i+1].y); ctx.stroke();
                        ctx.setLineDash([]);
                    }
                } else if (structureType === 'ionic') {
                    ctx.fillStyle = p.type === 'pos' ? '#ef4444' : '#3b82f6';
                    const rad = p.type === 'pos' ? 10 : 15;
                    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.textAlign = 'center';
                    ctx.fillText(p.type === 'pos' ? '+' : '-', p.x, p.y + 5);
                } else if (structureType === 'metallic') {
                    ctx.fillStyle = current.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.fillText('+', p.x, p.y + 5);
                    if (!isGas) {
                        ctx.fillStyle = '#4ade80';
                        const ex = p.x + Math.sin(time*3 + i) * 25;
                        const ey = p.y + Math.cos(time*3 + i) * 25;
                        ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI*2); ctx.fill();
                    }
                } else {
                    ctx.fillStyle = current.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2); ctx.fill();
                    if (isSolid) {
                        ctx.strokeStyle = 'rgba(0, 212, 255, 0.2)';
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(particles[(i+1)%particles.length].x, particles[(i+1)%particles.length].y); ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        tempSlider.addEventListener('input', (e) => {
            temperature = parseInt(e.target.value);
            updateStateUI();
        });

        window.addEventListener('resize', resize);
        window.onload = () => {
            lucide.createIcons();
            resize();
            initParticles();
            animate();
        };
    </script>
</body>
</html>
